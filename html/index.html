<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />

    <title>Minha Primeira Página</title>
  </head>

  <body>
    <div class="jogo">
      <h1>TITULO</h1>

      <div class="linha">
        <div class="personagem">
          <img
            src="https://e7.pngegg.com/pngimages/1017/966/png-clipart-rpg-character-video-game-man.png"
          />
          <h2>HP</h2>
        </div>

        <button>JOGAR</button>

        <div class="personagem">
          <img
            id="jogarUmImg"
            src="https://img.freepik.com/vetores-premium/personagens-coloridos-de-rpg-vetoriais_983400-256.jpg"
          />

          <div class="vida">
            <p id="jogadorUmVida">HP 100</p>

            <div class="bordaVida">
              <div class="barraVida"
              id="jogadorUmVidaPorcentagem"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <div class="console">console.log</div>
    </div>
  </body>
</html>
